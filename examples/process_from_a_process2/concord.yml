configuration:
  runtime: "concord-v2"

flows:
  default:
  # starts a process and retrieves it's variable value
  - task: concord
    in:
      action: start
      archive: out.zip
      sync: true
      # list of output variables
      outVars:
      - result
    out: jobOut
  - log: "${jobOut.result}"

  # starts a process from an existing project (it must be created beforehand)
  - task: concord
    in:
      action: start
      project: test
      repository: default
      sync: true
    out: startResult
  - log: "Done! ${startResult.id} is completed"

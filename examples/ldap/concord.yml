configuration:
  runtime: concord-v2
  dependencies:
  - "mvn://com.walmartlabs.concord.plugins:ldap-task:2.12.1"

flows:
  default:
  - task: ldap
    in:
      action: getUser
      ldapAdServer: "ldap://ldaphost:port"
      bindUserDn: "myBindUser"
      bindPassword: "myBindPwd"
      searchBase: "DC=MyOrg,DC=com"
      user: "myUser"
    out:
      ldapResult: ${result.result}

  - log: "${ldapResult}"

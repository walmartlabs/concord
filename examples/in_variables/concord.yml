configuration:
  runtime: concord-v2
  arguments:
    name: "Concord"

flows:
  default:
  # Override "name" only in the called flow.
  - call: sayHello
    in:
      name: "${initiator.username}"

  # The caller's name remains "Concord" after the call.
  # This logs "Bye, Concord".
  - call: sayBye

  sayHello:
  - log: "Hello, ${name}"

  sayBye:
  - log: "Bye, ${name}"


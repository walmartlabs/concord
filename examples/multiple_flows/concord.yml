configuration:
  runtime: "concord-v2"

flows:
  default:
  - script: js
    body: |
      result.set("name", "Concord");
    out:
      name: ${result.name}

  # call another flow
  - sayHello

  # call another flow and add/override its variables
  - call: sayHello
    in:
      name: "world"

  sayHello:
  - log: "Hello, ${name}"

configuration:
  runtime: concord-v2
  dependencies:
  - "mvn://org.apache.groovy:groovy-all:pom:5.0.4"
  - "mvn://io.github.http-builder-ng:http-builder-ng-core:0.16.1"
  - "mvn://xml-resolver:xml-resolver:1.2"

flows:
  default:
  - script: groovy
    body: |
      import static groovyx.net.http.HttpBuilder.configure

      def http = configure {
        request.uri = "http://localhost:8001"
      }

      Map response = http.get(Map) {
        request.uri.path = "/api/v1/server/version"
      }

      result.set("serverVersion", response["version"])
    out:
      serverVersion: ${result.serverVersion}

  - log: "Server's version: ${serverVersion}"



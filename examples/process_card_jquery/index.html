<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Deployment information</title>
    <style>
        body { background: white; font-family: sans-serif; }
        label { display: block; margin: 12px 0; }
    </style>
</head>
<body>
<h1>Deployment information</h1>
<form id="form">
    <label>Release version <input name="release" required></label>
    <label>Field 1 <input name="field1" required></label>
    <label>Field 2 <input name="field2"></label>
    <label>Field 3 <input name="field3"></label>
    <button type="button" disabled>Submit</button>
</form>
<p id="status">Open this card in the Concord console to start a process.</p>
<script>
    const protocol = 'concord-process-card-v1';
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    const fields = ['release', 'field1', 'field2', 'field3'];
    let channel;
    window.addEventListener('message', (event) => {
        const message = event.data;
        if (event.source !== window.parent || window.parent === window ||
            !message || message.protocol !== protocol) return;
        if (message.type === 'init' && typeof message.channel === 'string' && !channel) {
            channel = message.channel;
            for (const field of fields) {
                form.elements[field].value = message.data.values?.[`arguments.${field}`] ||
                    message.data.values?.[field] || '';
            }
            form.querySelector('button').disabled = false;
            status.textContent = '';
        } else if (message.channel === channel && message.type === 'error') {
            status.textContent = message.message;
            form.querySelector('button').disabled = false;
        } else if (message.channel === channel && message.type === 'started') {
            status.textContent = 'Process started. Opening its log in the console…';
        }
    });
    form.querySelector('button').addEventListener('click', (event) => {
        event.preventDefault();
        if (!channel || !form.reportValidity()) return;
        form.querySelector('button').disabled = true;
        const args = Object.fromEntries(fields.map((field) => [field, form.elements[field].value]));
        window.parent.postMessage({ protocol, type: 'start', channel, arguments: args }, '*');
    });
    form.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            form.querySelector('button').click();
        }
    });
</script>
</body>
</html>

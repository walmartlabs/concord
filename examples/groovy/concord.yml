configuration:
  runtime: concord-v2
  dependencies:
  - "mvn://org.apache.groovy:groovy-all:pom:5.0.4"

flows:
  default:
  - script: groovy
    body: |
      result.set("x", 123)
    out:
      x: ${result.x}

  - script: groovy
    body: |
      // Process variables are available directly to the script
      println x


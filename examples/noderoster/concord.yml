configuration:
  runtime: concord-v2
  dependencies:
  - "mvn://com.walmartlabs.concord.plugins.basic:noderoster-tasks:2.40.0"

flows:
  default:
    - call: findHostsWithArtifacts
    - call: findFacts
    - call: findDeployedOnHosts

  findHostsWithArtifacts:
  - task: nodeRoster
    in:
      action: "hostsWithArtifacts"
      artifactPattern: "storesystems"
    out:
      result: ${result.hosts}
  - log: "${result}"

  findFacts:
  - task: nodeRoster
    in:
      action: "facts"
      hostName: "host.example.com"
    out:
      result: ${result.facts}
  - log: "${result}"

  findDeployedOnHosts:
  - task: nodeRoster
    in:
      action: "deployedOnHost"
      hostName: "host.example.com"
    out:
      result: ${result.artifacts}
  - log: "${result}"

flows:
  default:
  # a regular form
  - form: myForm1
  - log: "${myForm1}"

  # an one-off form
  - form: myForm2
    fields:
    - firstName: {type: "string", label: "First Name"}
  - log: "${myForm2}"

  # a form with fields stored in a variable
  - form: myForm3
    fields: ${myForm3Fields}
  - log: "${myForm3}"

  # a form with fields created in a script
  - script: groovy
    body: |
      def myFields = [
        ["firstName": ["type": "string", "label": "First Name"]],
        ["lastName": ["type": "string", "label": "Last Name"]]
      ]

      result.set('fields', myFields)
    out: formDefinition
  - form: myForm4
    fields: ${formDefinition.fields}
  - log: "${myForm4}"

forms:
  myForm1:
  - firstName: {type: "string", label: "First Name"}

configuration:
  runtime: concord-v2
  dependencies:
    - "mvn://org.apache.groovy:groovy-all:pom:5.0.4"
  arguments:
    myForm3Fields:
    - firstName: {type: "string", label: "First Name"}

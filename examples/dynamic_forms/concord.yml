configuration:
  runtime: concord-v2
  dependencies:
    - "mvn://org.apache.groovy:groovy-all:pom:5.0.4"

flows:
  default:

    # creating a form using a Groovy script
    - script: groovy
      body: |
        // define the form's fields and options
        // the structure is the same as in the form call's syntax
        def myForm = [
          "fields": [
            ["firstName": ["type": "string", "label": "First Name"]],
            ["lastName": ["type": "string", "label": "Last Name"]]
          ],
          "values": [
              "firstName": "John",
              "lastName": "Smith"
          ]
        ]

        result.set('definition', myForm)
      out: formDefinition

    - form: myForm
      fields: ${formDefinition.definition.fields}
      values: ${formDefinition.definition.values}

    - log: "${myForm}"

    # creating a form using an expression
    - set:
        myForm:
          fields:
          - firstName: { label: "First name", type: "string" }
          - lastName: { label: "Last name", type: "string" }
          values:
            firstName: "John"
            lastName: "Smith"

    - form: myForm
      fields: ${myForm.fields}
      values: ${myForm.values}

    - log: "${myForm}"

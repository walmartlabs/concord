configuration:
  runtime: concord-v2
  arguments:
    name: "Concord"
  runner:
    logLevel: "DEBUG"

flows:
  default:
    - ${log.debug("This is a debug log")}
    - ${log.info("This is a info log")}
    - ${log.warn("This is a warn log")}
    - ${log.error("This is a error log")}

    - task: log
      in:
        level: DEBUG
        msg: "Hello, ${name}. This is a debug log"
    - log: "Hello, ${name}. This is a normal log"
    - task: log
      in:
        level: WARN
        msg: "Hello, ${name}. This is a warn log"
    - task: log
      in:
        level: ERROR
        msg: "Hello, ${name}. This is a error log"
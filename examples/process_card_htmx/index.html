<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Process card form</title>
    <style>body { background: white; font-family: sans-serif; } label, button { margin: 10px; }</style>
</head>
<body>
<form id="form">
    <label>Name <input name="name" required></label>
    <button type="button" disabled>Run process</button>
</form>
<p id="status">Open this card in the Concord console to start a process.</p>
<script>
    const protocol = 'concord-process-card-v1';
    const form = document.getElementById('form');
    const status = document.getElementById('status');
    let channel;
    window.addEventListener('message', (event) => {
        const message = event.data;
        if (event.source !== window.parent || window.parent === window ||
            !message || message.protocol !== protocol) return;
        if (message.type === 'init' && typeof message.channel === 'string' && !channel) {
            channel = message.channel;
            form.elements.name.value = message.data.values?.name || '';
            form.querySelector('button').disabled = false;
            status.textContent = '';
        } else if (message.channel === channel && message.type === 'error') {
            status.textContent = message.message;
            form.querySelector('button').disabled = false;
        } else if (message.channel === channel && message.type === 'started') {
            status.textContent = 'Process started. Opening its log in the console…';
        }
    });
    form.querySelector('button').addEventListener('click', (event) => {
        event.preventDefault();
        if (!channel || !form.reportValidity()) return;
        form.querySelector('button').disabled = true;
        window.parent.postMessage({
            protocol, type: 'start', channel, arguments: { name: form.elements.name.value }
        }, '*');
    });
    form.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
            event.preventDefault();
            form.querySelector('button').click();
        }
    });
</script>
</body>
</html>

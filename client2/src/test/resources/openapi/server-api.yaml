  /api/v1/events/{eventName}:
    post:
      tags:
      - External Events
      description: Handles an external event
      operationId: externalEvent
      parameters:
      - name: eventName
        in: path
        required: true
        schema:
          pattern: .*
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
      responses:
        default:
          description: default response
          content:
            '*/*': {}
  /events/github/webhook:
    post:
      tags:
      - GitHub Events
      description: Handles GitHub repository level events
      operationId: onEvent
      parameters:
      - name: query
        in: query
        schema:
          type: object
          additionalProperties:
            type: object
        x-concord:
          customQueryParams: "true"
      - name: X-GitHub-Delivery
        in: header
        schema:
          type: string
      - name: X-GitHub-Event
        in: header
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: object
      responses:
        default:
          description: default response
          content:
            text/plain:
              schema:
                type: string

openapi: 3.0.1
info:
  title: Concord Server API
  description: Concord Server API
  version: "2.0"
paths:
  /api/v1/agent/all/workersCount:
    get:
      tags:
      - Agents
      description: Counts the currently connected workers based on the specified capabilities
        property
      operationId: aggregate
      parameters:
      - name: capabilities
        in: query
        schema:
          type: string
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int64
  /api/v1/agent/all/workers:
    get:
      tags:
      - Agents
      description: List currently available agent workers
      operationId: listWorkers
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentWorkerEntry'
  /api/v1/audit:
    get:
      tags:
      - Audit Log
      description: List audit log entries for the specified organization
      operationId: list
      parameters:
      - name: object
        in: query
        schema:
          type: string
          enum:
          - API_KEY
          - EXTERNAL_EVENT
          - JSON_STORE
          - JSON_STORE_DATA
          - JSON_STORE_QUERY
          - ORGANIZATION
          - POLICY
          - PROJECT
          - PROCESS
          - ROLE
          - SECRET
          - SYSTEM
          - TEAM
          - USER
      - name: action
        in: query
        schema:
          type: string
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - ACCESS
      - name: userId
        in: query
        schema:
          type: string
          format: uuid
      - name: username
        in: query
        schema:
          type: string
      - name: after
        in: query
        schema:
          $ref: '#/components/schemas/OffsetDateTimeParam'
      - name: before
        in: query
        schema:
          $ref: '#/components/schemas/OffsetDateTimeParam'
      - name: offset
        in: query
        schema:
          type: integer
          format: int32
          default: 0
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          default: 30
      responses:
        default:
          description: default response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
  /api/v1/processcard/{id}/access:
    post:

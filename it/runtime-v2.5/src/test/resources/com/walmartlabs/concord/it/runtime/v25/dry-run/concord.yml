configuration:
  runtime: concord-v2.5
  dependencies:
    - "mvn://com.walmartlabs.concord.it.tasks:serialization-test:PROJECT_VERSION"
    - "mvn://com.walmartlabs.concord.plugins.basic:mock-tasks:PROJECT_VERSION"
  arguments:
    mocks:
      - task: serializationTest
        out:
          value: mocked-in-dry-run
flows:
  default:
    - task: serializationTest
      out: result
    - log: "v25-dry-run result=${result.value}"

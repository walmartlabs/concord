configuration:
  runtime: concord-v2

flows:
  default:
    - try:
      - call: startChild
        out: [jobOut]
        in:
          enterHere: default
      error:
        - call: startChild
          out: [jobOut]
          in:
            enterHere: setHello
    - log: "${jobOut.xyz}"

  startChild:
    - task: concord
      out: jobOut
      in:
        apiKey: "${myApiKey}"
        action: start
        payload: payload
        sync: true
        suspend: true
        entryPoint: ${enterHere}
        arguments:
          name: "Concord"
        outVars:
          - xyz

flows:
  default:
  - try:
    - log: "Url is: ${url}"
    - task: http
      in:
       method: GET
       auth:
        basic:
          username: ${user}
          password: ${password}
       url: ${url}
       response: "json"
      out: rsp
    - log: "Success response: ${rsp.ok}"
    - log: "Out Response: ${rsp.ok}"
    error:
    - log: "Gotcha! ${lastError}"

configuration:
  arguments:
    url: "http://localhost:8001"
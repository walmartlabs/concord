configuration:
  runtime: concord-v2

flows:
  default:
  - set:
      children: []

  - task: concord
    in:
      action: start
      payload: payload
    out: firstChild

  - ${children.add(firstChild.id)}

  - task: concord
    in:
      action: start
      payload: payload
    out: secondChild

  - ${children.add(secondChild.id)}

  - log: "children: ${children}"

  - ${concord.suspendForCompletion(children)}

  - log: "process is resumed."
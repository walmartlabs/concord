configuration:
  entryPoint: main
  arguments:
    name: "world"

flows:
  main:
  - task: docker
    in:
      image: ${image}
      debug: true
      forcePull: false
      saveOut: true
      logOut: false
      logErr: false
      cmd: echo "Hello, ${name}" && (>&2 echo "STDERR WORKS")
    out: result
  - log: "stdout captured: ${result.stdout.trim() == 'Hello, world'}"
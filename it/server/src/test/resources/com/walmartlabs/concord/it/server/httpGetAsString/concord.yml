flows:
  default:
  - try:
    - log: "Url is: ${url}"
    - task: http
      in:
        url: ${url}
        response: string
      out: rsp
    - log: "Success response: ${rsp.ok}"
    - log: "${rsp.content}"
    error:
    - log: "Gotcha! ${lastError}"

configuration:
  arguments:
    url: "http://localhost:8001"
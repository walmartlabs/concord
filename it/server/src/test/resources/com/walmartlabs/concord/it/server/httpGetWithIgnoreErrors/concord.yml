flows:
  default:
  - task: http
    in:
     method: GET
     auth:
      basic:
        username: ${user}
        password: ${password}
     url: ${url}
     response: "json"
     ignoreErrors: true
    out: rsp
    ignoreErrors: true
  - log: "Success response: ${rsp.ok}"

  - log: "statusCode: ${rsp.statusCode}"
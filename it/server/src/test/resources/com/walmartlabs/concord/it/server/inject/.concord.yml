configuration:
  runtime: concord-v2
  dependencies:
    - mvn://com.walmartlabs.concord.plugins.basic:example-tasks:PROJECT_VERSION
  entryPoint: main
  arguments:
    myName: "Concord"

flows:
  main:
  - ${example.hello("myName")}

  - set:
      myName: "world"
  - ${example.helloButLouder(myName)}

  - task: example
    in:
      myName: ${myName}

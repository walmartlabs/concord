flows:
  default:

  - task: http
    in:
      method: POST
      url: ${url}
      auth:
        basic:
          username: ${user}
          password: ${password}
      body:
        - key: value
          one: two
      request: json
      response: json
    out: rsp
  - log: "Success response: ${rsp.ok}"
  - log: "Out Response: ${rsp.ok}"
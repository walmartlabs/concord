flows:
  onPush:
  - log: "onPush!"

triggers:
  - github:
      version: 2
      entryPoint: onPush
      conditions:
        type: "push"
        branch: "foo"
  - github:
      version: 2
      entryPoint: onPush
      conditions:
        type: "push"
        branch: "foo2"
  - oneops:
      version: 2
      conditions:
        org: "myOrg"
      entryPoint: onPush
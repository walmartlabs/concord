flows:
  default:
  - try:
    - task: http
      in:
        method: GET
        url: ${url}
        response: json
      out: rsp
    - log: "Success response: ${rsp.ok}"
    - log: "Out Response: ${rsp.ok}"
    error:
    - log: "Gotcha! ${lastError}"

configuration:
  arguments:
    url: "http://localhost:8001"
flows:
  main:
  - form: myForm1
  - throw: "boom!"

  onFailure:
  - log: "txId: ${txId}"
  - log: "projectInfo orgName: ${projectInfo.orgName}"
  - log: "processInfo sessionToken present: ${processInfo.sessionToken != null}"
  - log: "initiator username: ${initiator.username}"

forms:
  myForm1:
  - firstName: { label: "First Name", type: "string" }

configuration:
  runtime: concord-v2
  entryPoint: main
configuration:
  dependencies:
    - "mvn://org.apache.groovy:groovy-all:pom:5.0.4"

flows:
  default:
    - script: groovy
      body: |
        def fields = [
          ["firstName": ["type": "string"]],
          ["lastName": ["type": "string"]]
        ]
        execution.variables().set("myFields", fields)

    - form: myForm
      fields: "${myFields}"

    - log: "${myForm}"

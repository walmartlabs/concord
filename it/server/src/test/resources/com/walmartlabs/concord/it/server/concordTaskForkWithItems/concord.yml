configuration:
  runtime: concord-v2
  arguments:
    forkItems:
    - entryPoint: sayHello
      arguments:
        color: "RED"
    - entryPoint: sayHello
      arguments:
        color: "WHITE"

flows:
  default:
  - task: concord
    in:
      action: fork
      debug: true # to see the arguments in the log
      entryPoint: ${item.entryPoint}
      arguments: ${item.arguments}
    out:
      jobs: ${result.ids}
    withItems: ${forkItems}

  - log: "Done! ${jobs} is completed"

  sayHello:
  - log: "FORK: Hello, ${color}"
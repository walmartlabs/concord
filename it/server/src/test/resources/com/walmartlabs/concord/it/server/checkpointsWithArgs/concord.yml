configuration:
  runtime: concord-v2

  arguments:
    varA: "hello, World!"
    varB: "${crypto.decryptString(encrypted)}"

flows:
  default:
  - set:
      keyVar: ${varB}
  - log: ${varA}
  - log: "varB matches: ${varB == expected}"
  - log: "keyVar matches: ${keyVar == expected}"
  - checkpoint: "pointA"
  - log: ${varA}
  - log: "varB matches: ${varB == expected}"
  - log: "keyVar matches: ${keyVar == expected}"

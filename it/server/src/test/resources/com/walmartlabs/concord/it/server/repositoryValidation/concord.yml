flows:
  default:
  - log: "default flow..."

  onCronEvent:
  - log: "on Cron event"

  onGitEvent:
  - log: "on Git event"

triggers:
  - cron:
      spec: 30 * * * *
      entryPoint: onCronEvent

  - github:
      version: 2
      conditions:
        type: "push"
        githubOrg: "myProject"
        githubRepo: "myRepository"
      entryPoint: onGitEvent

  - eventSource:
      version: 2
      conditions:
        spec: "specs"
        param1: ".*123.*"
        param2: false
        param3: 123
      entryPoint: default
      arguments:
         array:
          - val1
          - val2

configuration:
  entryPoint: main
  arguments:
    name: "world"

flows:
  main:
  - task: docker
    in:
      image: ${image}
      debug: true
      forcePull: false
      saveOut: true
      logOut: false
      cmd: echo "Hello, ${name}" && (>&2 echo "STDERR STILL WORKS")
    out: result
  - log: "!! ${result.stdout.trim()} !!"
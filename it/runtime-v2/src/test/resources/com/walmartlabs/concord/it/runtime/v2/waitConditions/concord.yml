configuration:
  runtime: concord-v2

flows:
  execute:
    - task: waitForExternalEvent
      in:
        externalEvents: "${externalEvents}"
      out: waitOut

  single:
    - task: waitForExternalEvent
      in:
        externalEvents:
          - eventId: "external_event"
            saveAs: "resumeResult"
      out: waitOut

    # ensure null's are represents as strings in the logs for test assertions
    - log: "external result: ${waitOut.resumeResult.externalResultOk == null ? 'null' : waitOut.resumeResult.externalResultOk}"

  singleNoSaveAs:
    - task: waitForExternalEvent
      in:
        externalEvents:
          - eventId: "external_event"
      out: waitOut

    - log: "external result: ${waitOut.resumeResult.externalResultOk == null ? 'null' : waitOut.resumeResult.externalResultOk}"

  multipleEventsSingleThread:
    - task: waitForExternalEvent
      in:
        externalEvents:
          - eventId: "external_event_1"
            saveAs: "resumeResult1"
          - eventId: "external_event_2"
            saveAs: "resumeResult2"
      out: waitOut

    - log: "external result 1: ${waitOut.resumeResult1.externalResultOk}"
    - log: "external result 2: ${waitOut.resumeResult2.aDifferentResultKey}"

  multipleEventsMultipleThreads:
    - call: wait
      in:
        id: "${item}"
      loop:
        items: [ "A", "B" ]
        mode: parallel

  wait:
    - task: waitForExternalEvent
      in:
        externalEvents:
          - eventId: "external_event_${id}_1"
            saveAs: "resumeResult1"
          - eventId: "external_event_${id}_2"
            saveAs: "resumeResult2"
      out: waitOut

    - log: "external result ${id}_1: ${waitOut.resumeResult1.externalResultOk}"
    - log: "external result ${id}_2: ${waitOut.resumeResult2.aDifferentResultKey}"

  expire:
    - task: waitForExternalEvent
      in:
        externalEvents:
          - eventId: "external_event"
            saveAs: "resumeResult"
            expiresAt: "${datetime.current().toInstant().plusSeconds(2)}"
      out: waitOut

    - log: "external result isExpired: ${waitOut.resumeResult.isExpired}"

  oneSuccessOneExpired:
    - task: waitForExternalEvent
      in:
        externalEvents:
          - eventId: "external_event_1"
            saveAs: "resumeResult1"
          - eventId: "external_event_2"
            saveAs: "resumeResult2"
#            expiresAt: "NOT_A_DATE"
            expiresAt: "${datetime.current().toInstant().plusSeconds(2)}"
      out: waitOut

    - log: "external result 1: ${waitOut.resumeResult1.getOrDefault('externalResultOk', 'null')}"     # true
    - log: "external result 2: ${waitOut.resumeResult2.getOrDefault('aDifferentResultKey', 'null')}"  # null
